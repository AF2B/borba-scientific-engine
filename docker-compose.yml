name: borba-scientific-engine

# What the application containers have in common. The engine is stateless: it needs no writable filesystem beyond a
# scratch /tmp, no Linux capabilities (it listens on an unprivileged port) and no way to gain privileges.
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  mem_limit: ${APP_MEMORY_LIMIT:-512m}

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    # The default of 100 connections is easily exhausted by the integration tests, which run many small applications
    # against this one server at once.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to loopback only: the database is never exposed to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Applies the database migrations once and exits. The application never migrates on startup: with several replicas
  # they would race, and a failed migration would take every one of them down.
  migrate:
    <<: *hardened
    image: ${IMAGE:-borba-scientific-engine:dev}
    pull_policy: never
    command: ["migrate", "--yes"]
    restart: "no"
    # A one-shot job has nothing to probe: the image's health check would only report it as unhealthy while it runs.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  app:
    <<: *hardened
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
        APP_COMMIT: ${APP_COMMIT:-unknown}
        APP_BUILD_DATE: ${APP_BUILD_DATE:-}
    image: ${IMAGE:-borba-scientific-engine:dev}
    restart: unless-stopped
    # Longer than the application's own shutdown timeout, so that Docker waits for the graceful shutdown instead of
    # killing the process in the middle of it.
    stop_grace_period: 30s
    # The command is the image's; only the interval is shortened, so that `up --wait` returns promptly.
    healthcheck:
      interval: 5s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"

volumes:
  postgres-data:
