included:
  - Sources
  - Tests
  - Package.swift

excluded:
  - .build
  - Tools/.build

opt_in_rules:
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicit_return
  - last_where
  - legacy_multiple
  - modifier_order
  - multiline_parameters
  - no_magic_numbers
  - operator_usage_whitespace
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - vertical_parameter_alignment_on_call

disabled_rules:
  - todo
  # swift-format owns trailing commas: it adds them to multi-element collections and removes them from single-element
  # ones, which `mandatory_comma` would flag.
  - trailing_comma
  # A closure with a typed `throws(Failure)` clause requires parenthesized parameters, so the rule contradicts the
  # language.
  - unneeded_parentheses_in_closure_argument

line_length:
  warning: 120
  error: 140
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 600
  error: 1000
  ignore_comment_only_lines: true

function_body_length:
  warning: 40
  error: 80

# An exhaustive `switch` that maps every case is the intended way to extend a module, not complexity.
cyclomatic_complexity:
  warning: 10
  error: 20
  ignores_case_statements: true

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y
    - z

type_name:
  # `P` is the conventional local alias of a module's parameter namespace.
  excluded:
    - P

nesting:
  type_level: 2

# Named constants are the only place a bare literal may appear.
no_magic_numbers:
  allowed_numbers: [0, 1, 2]
