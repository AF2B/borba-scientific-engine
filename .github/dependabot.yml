# Keeps what the project builds on current: Swift packages, the actions the pipelines run, and the base images. Each
# update arrives as a pull request that the Test and Build pipelines then verify. See ADR-009.
version: 2

updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      vapor:
        patterns: ["vapor", "fluent*", "async-kit", "multipart-kit", "routing-kit", "console-kit", "websocket-kit"]
      swift-server:
        patterns: ["swift-*", "async-http-client", "postgres-*", "sql-kit"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
