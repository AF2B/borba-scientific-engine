name: Registry

# Builds the production image, verifies it, scans it and publishes it to the GitHub Container Registry. Pull requests
# that can affect the image build and verify it but never publish. See ADR-009.
#
# Tags published:
#   latest        the tip of the default branch (mutable; never deploy it)
#   main          the tip of the branch (mutable)
#   v1.2.3        a release; immutable, and the workflow refuses to overwrite one
#   v1.2          the latest patch of a release line (mutable)
#   sha-1a2b3c4   the commit (immutable)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - Package.swift
      - Package.resolved
      - Sources/**
      - Scripts/smoke-container.sh
      - Scripts/deploy.sh
      - Scripts/deploy/**
      - Scripts/test-deploy.sh
      - Scripts/verify-deployment.sh
      - .github/workflows/registry.yml
  workflow_dispatch:

permissions:
  contents: read

# A publication is never cancelled half way: a newer push waits for the one in progress.
concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # What the verification steps run. It is never pushed under this name.
  LOCAL_IMAGE: borba-scientific-engine:ci

jobs:
  image:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Describe the build
        id: build
        env:
          REPOSITORY: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "${REF_TYPE}" == "tag" ]]; then
            version="${REF_NAME}"
          else
            version="${REF_NAME//[^A-Za-z0-9._-]/-}-${SHA::7}"
          fi

          # The commit's own time, so that building a commit twice gives the same labels and the same image configuration.
          epoch="$(git show --no-patch --format=%ct "${SHA}")"
          {
            # Registry names are lowercase; repository names need not be.
            echo "image=ghcr.io/${REPOSITORY,,}"
            echo "version=${version}"
            echo "epoch=${epoch}"
            echo "date=$(date -u -d "@${epoch}" +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compute the tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.build.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build the image for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.build.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_DATE=${{ steps.build.outputs.date }}
            SOURCE_DATE_EPOCH=${{ steps.build.outputs.epoch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the container
        run: IMAGE="${LOCAL_IMAGE}" Scripts/ci-summary.sh "Container check" Scripts/smoke-container.sh

      # The deployment tooling, run against the image that is about to be published: a first deployment, an upgrade, a
      # release that fails to start and one that fails to serve, and the rollbacks.
      - name: Rehearse a deployment and a rollback
        run: IMAGE="${LOCAL_IMAGE}" Scripts/ci-summary.sh "Deployment rehearsal" Scripts/test-deploy.sh

      - name: Scan the image for vulnerabilities
        run: Scripts/ci-summary.sh "Image vulnerabilities" make scan-image IMAGE="${LOCAL_IMAGE}"

      - name: Log in to the registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A version is a promise that what it names does not change. The registry cannot enforce that, so the pipeline does.
      - name: Refuse to overwrite a published version
        if: ${{ github.ref_type == 'tag' }}
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          TAG: ${{ github.ref_name }}
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${TAG} is already published. A version is immutable: release a new one instead."
            exit 1
          fi

      # The same inputs through the same cache as the verified build, so every layer is the one that was verified.
      - name: Publish the image
        id: push
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.build.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_DATE=${{ steps.build.outputs.date }}
            SOURCE_DATE_EPOCH=${{ steps.build.outputs.epoch }}
          cache-from: type=gha
          sbom: true
          provenance: false

      # Artifact attestations exist for public repositories, and for private ones only on GitHub Enterprise Cloud.
      - name: Attest where the image was built
        if: ${{ github.event_name != 'pull_request' && !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Say that no attestation was made
        if: ${{ github.event_name != 'pull_request' && github.event.repository.private }}
        run: echo "::warning::Artifact attestations need a public repository or GitHub Enterprise Cloud, so this image carries no attested provenance."

      - name: Summarize the publication
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.build.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published image"
            echo
            echo "Deploy it by digest: \`${IMAGE}@${DIGEST}\`"
            echo
            echo '```text'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
